name: still_life
description: "Still Life - Home Inventory Management System. Offline-first, privacy-respecting home inventory with AI-powered video walkthrough analysis."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Database
  drift: ^2.25.0
  sqlite3_flutter_libs: ^0.5.0

  # Navigation
  go_router: ^15.1.0

  # UI / Theme
  openhearth_design:
    path: ../OpenHearth/ohStyle/openhearth_design

  # Encryption primitives (Ghost-tier backup + LAN-sync encryption).
  # Sibling path deps, mirroring openhearth_design above — clone the package
  # repos next to StillLife (see README "Sibling packages").
  sanctuary_auth_core:
    path: ../OpenHearth/packages/sanctuary_auth_core
  # Drop-in encrypted-backup UI (seed setup + .ohbk export/restore).
  sanctuary_backup_ui:
    path: ../OpenHearth/packages/sanctuary_backup_ui
  fl_chart: ^0.70.2
  intl: ^0.20.2
  # Injectable wall clock (clock.now()) so date-relative domain logic
  # (loan overdue/due-soon) is testable with a fixed time — golden tests
  # must not depend on the day they run.
  clock: ^1.1.1
  qr_flutter: ^4.1.0

  # HTTP
  dio: ^5.8.0

  # Camera & Video
  camera: ^0.11.0+2
  ffmpeg_kit_flutter_new: ^4.1.0

  # Network Discovery
  nsd: ^3.0.0

  # Barcode & OCR
  mobile_scanner: ^6.0.0
  google_mlkit_text_recognition: ^0.16.0 # commons ^0.12, in step with image_labeling

  # On-device AI (Android-only plugins; all touched via io/stub trios so
  # the web build never imports them)
  google_mlkit_image_labeling: ^0.15.0 # rung 1: bundled ~400-label model
  google_mlkit_genai_prompt: ^0.2.0 # rung 2: Gemini Nano via AICore
  llama_cpp_dart: 0.9.0-dev.9 # rung 1.5: GGUF VLM (SmolVLM2) via mtmd;
  # exact pin — the 0.9.x line warns of a breaking pass before 1.0

  # Speech Recognition
  speech_to_text: ^7.0.0

  # Image handling
  image_picker: ^1.1.2
  image: ^4.5.3

  # HTML parsing
  html: ^0.15.5

  # Hashing (model-download integrity verification)
  crypto: ^3.0.6

  # PDF Generation
  pdf: ^3.11.3
  printing: ^5.14.1

  # Storage & Security
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5
  path: ^1.9.1
  share_plus: ^10.1.4
  file_picker: ^9.2.1

  # Local Notifications
  flutter_local_notifications: ^18.0.0
  timezone: ^0.10.1

  # Sync / P2P
  crdt: ^5.1.3
  shelf: ^1.4.0
  shelf_router: ^1.1.4

  # CSV parsing
  csv: ^6.0.0

  # Share / receive shared files
  receive_sharing_intent: ^1.8.0

  # Deep links (Phase 22a — Stripe checkout return)
  app_links: ^6.3.2

  # External URL launching (Phase 22a — Stripe checkout)
  url_launcher: ^6.3.1

  # App version metadata (used by Settings → About)
  package_info_plus: ^8.1.2

  # Utilities
  uuid: ^4.5.1
  equatable: ^2.0.7
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  collection: ^1.19.1
  archive: ^4.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.15
  drift_dev: ^2.25.0
  riverpod_generator: ^2.6.5
  freezed: ^3.0.0
  json_serializable: ^6.9.4

  # Testing
  mockito: ^5.4.6
  build_verify: ^3.1.0
  mocktail: ^1.0.4
  sqlite3: ^2.9.4
  http_mock_adapter: ^0.6.1
  # Direct dev-deps so widget tests can fake the image picker platform.
  image_picker_platform_interface: ^2.11.1
  plugin_platform_interface: ^2.1.8

  # Fleet standards as tests that can fail (C1 style .. C6 harness) —
  # sibling path dep, same clone layout as the sanctuary packages above.
  oh_fleet_conformance:
    path: ../OpenHearth/packages/oh_fleet_conformance

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/

  fonts:
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Regular.ttf
        - asset: assets/fonts/Lora-Italic.ttf
          style: italic
        - asset: assets/fonts/Lora-Medium.ttf
          weight: 500
        - asset: assets/fonts/Lora-Bold.ttf
          weight: 700
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
