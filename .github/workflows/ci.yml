name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone the sibling packages
        # StillLife depends on sanctuary_auth_core / sanctuary_backup_ui and
        # openhearth_design by sibling path relative to the repo checkout
        # (../... per pubspec.yaml). Clone the public repos where
        # `flutter pub get` expects them (SANCTUARY-BRIEF §3). openhearth_design
        # is a package inside the ohStyle repo.
        run: |
          git clone --depth 1 https://github.com/levitatingflyfisher/sanctuaryAuthCore ../packages/sanctuary_auth_core
          git clone --depth 1 https://github.com/levitatingflyfisher/sanctuaryBackupUi ../packages/sanctuary_backup_ui
          git clone --depth 1 https://github.com/levitatingflyfisher/ohStyle ../ohStyle
          git clone --depth 1 https://github.com/levitatingflyfisher/ohFleetConformance ../packages/oh_fleet_conformance
          git clone --depth 1 https://github.com/levitatingflyfisher/DomovoiDiscernment ../DomovoiDiscernment
      - uses: subosito/flutter-action@v2
        with:
          # Must bundle Dart >= 3.10.7 to satisfy the sibling sanctuary packages'
          # pubspec `environment: sdk`; older Flutter fails version resolution.
          flutter-version: '3.38.7'
          cache: true
          channel: stable
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze

  server-test:
    name: Server Test (Hosted LLM Worker)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/hosted-llm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - name: Clone the sibling packages
        run: |
          git clone --depth 1 https://github.com/levitatingflyfisher/sanctuaryAuthCore ../packages/sanctuary_auth_core
          git clone --depth 1 https://github.com/levitatingflyfisher/sanctuaryBackupUi ../packages/sanctuary_backup_ui
          git clone --depth 1 https://github.com/levitatingflyfisher/ohStyle ../ohStyle
          git clone --depth 1 https://github.com/levitatingflyfisher/ohFleetConformance ../packages/oh_fleet_conformance
          git clone --depth 1 https://github.com/levitatingflyfisher/DomovoiDiscernment ../DomovoiDiscernment
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          cache: true
          channel: stable
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      # C3: the gz-JS size budget only bites when build/web exists
      - name: Build web (C3 budget artifact)
        run: flutter build web --release
      - run: flutter test --coverage

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Clone the sibling packages
        run: |
          git clone --depth 1 https://github.com/levitatingflyfisher/sanctuaryAuthCore ../packages/sanctuary_auth_core
          git clone --depth 1 https://github.com/levitatingflyfisher/sanctuaryBackupUi ../packages/sanctuary_backup_ui
          git clone --depth 1 https://github.com/levitatingflyfisher/ohStyle ../ohStyle
          git clone --depth 1 https://github.com/levitatingflyfisher/ohFleetConformance ../packages/oh_fleet_conformance
          git clone --depth 1 https://github.com/levitatingflyfisher/DomovoiDiscernment ../DomovoiDiscernment
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          cache: true
          channel: stable
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --debug

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Clone the sibling packages
        run: |
          git clone --depth 1 https://github.com/levitatingflyfisher/sanctuaryAuthCore ../packages/sanctuary_auth_core
          git clone --depth 1 https://github.com/levitatingflyfisher/sanctuaryBackupUi ../packages/sanctuary_backup_ui
          git clone --depth 1 https://github.com/levitatingflyfisher/ohStyle ../ohStyle
          git clone --depth 1 https://github.com/levitatingflyfisher/ohFleetConformance ../packages/oh_fleet_conformance
          git clone --depth 1 https://github.com/levitatingflyfisher/DomovoiDiscernment ../DomovoiDiscernment
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          cache: true
          channel: stable
      - run: |
          sudo apt-get update -y
          # libsecret: flutter_secure_storage_linux's pkg-config dep
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build linux

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Clone the sibling packages
        run: |
          git clone --depth 1 https://github.com/levitatingflyfisher/sanctuaryAuthCore ../packages/sanctuary_auth_core
          git clone --depth 1 https://github.com/levitatingflyfisher/sanctuaryBackupUi ../packages/sanctuary_backup_ui
          git clone --depth 1 https://github.com/levitatingflyfisher/ohStyle ../ohStyle
          git clone --depth 1 https://github.com/levitatingflyfisher/ohFleetConformance ../packages/oh_fleet_conformance
          git clone --depth 1 https://github.com/levitatingflyfisher/DomovoiDiscernment ../DomovoiDiscernment
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          cache: true
          channel: stable
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build web
